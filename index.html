<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cowboysdocowboyshit</title>
  <meta name="description" content="People upload their cowboy shit. Strangers decide how cowboy it actually is." />
  <meta property="og:title" content="cowboysdocowboyshit" />
  <meta property="og:description" content="People upload their cowboy shit. Strangers decide how cowboy it actually is." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cowboysdocowboyshit.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="hero">
    <div class="slides">
      <div class="slide slide--1" style="background-image: url('assets/photo-1.jpg');"></div>
      <div class="slide slide--2" style="background-image: url('assets/photo-2.jpg');"></div>
    </div>
    <div class="vignette"></div>
    <div class="content">
      <h1 class="title">cowboys do cowboy shit</h1>
      <p class="tagline">rank how cowboy it is</p>
      <div class="hero-ctas">
        <a class="btn" href="/vote">vote now</a>
        <a class="btn btn-secondary" href="/submit">submit yours</a>
      </div>
    </div>
  </main>
  <div class="winner-strip" id="winner-strip" hidden>
    <span class="winner-label">most cowboy today</span>
    <a id="winner-link" href="/leaderboard">—</a>
    <span style="margin-left:auto"><a href="/leaderboard">leaderboard →</a></span>
  </div>
  <script>
    // Pull today's leader and pin it under the hero. Silent fail if there's
    // no winner yet (fresh deploy, empty DB).
    fetch("/api/winner/today").then((r) => r.json()).then((j) => {
      if (!j.winner) return;
      const el = document.getElementById("winner-strip");
      const link = document.getElementById("winner-link");
      const credit = j.winner.display_name || "anonymous cowboy";
      link.textContent = `${j.winner.rating} pts · by ${credit}`;
      link.href = `/c/${j.winner.slug}`;
      el.hidden = false;
    }).catch(() => {});
  </script>
</body>
